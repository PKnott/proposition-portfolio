name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # The suite runs against a clean checkout: `Inputs/` and `Outputs/` are
      # gitignored, and the handful of tests that need real data skip themselves
      # rather than fail. Measured locally: 500 passed, 3 skipped with no data
      # present, against 501 passed, 2 skipped with it.
      - name: Test
        run: pytest tests/ -q
