name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # Runs against a clean checkout. Nothing the pipeline reads is in the repo:
      # `Inputs/` and `Outputs/` are gitignored, and the cached clean table lives
      # in ~/.cache outside the project. Every test that needs any of it routes
      # through a fixture that skips when it is absent. Measured: 484 passed,
      # 19 skipped with nothing present, against 501 passed, 2 skipped with
      # everything.
      - name: Test
        run: pytest tests/ -q
