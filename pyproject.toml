[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpp"
version = "0.1.0"
description = "Pooled multi-market football prediction pipeline (goals, shots, shots on target, corners)"
requires-python = ">=3.11"
dependencies = [
    "soccerdata>=1.9",
    "pandas>=2.0",
    "numpy>=1.26",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    # openpyxl needs Pillow to embed the calibration figures; it does not declare
    # it, so an install without this writes the workbook silently picture-less.
    "pillow>=10.0",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "requests>=2.31",
    "certifi>=2024.2",
]

[tool.setuptools.packages.find]
include = ["fpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
